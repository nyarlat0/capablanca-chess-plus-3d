[package]
name = "bevy-front"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
bevy = { version = "0.19.0", features = ["jpeg"] }
bevy_panorbit_camera = "0.35.0"
capablanca-engine = { path = "../engine" }
ewebsock = "0.8.0"
fastrand = { version = "2.5.0", features = ["js"] }
multiplayer-protocol = { path = "../multiplayer-protocol" }
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.19.0", features = ["basis-universal"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["ErrorEvent", "Location", "MessageEvent", "Storage", "Window", "Worker"] }
