[package]
name = "bevy-front"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.0", features = ["jpeg"] }

bevy_panorbit_camera = "0.35.0"
bevy_picking = "0.19.0"
crossbeam-channel = "0.5.16"
futures-lite = "2.6.1"
num-traits = "0.2.19"
capablanca-engine = {path = "../engine"}

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 2
#codegen-units = 1
strip = true  # Automatically strip symbols from the binary.
lto = false
panic = "abort"
