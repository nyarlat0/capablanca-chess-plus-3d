[package]
name = "bevy-front"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license.workspace = true

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
    "async_executor",
    "bevy_anti_alias",
    "bevy_asset",
    "bevy_audio",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gltf",
    "bevy_image",
    "bevy_input_focus",
    "bevy_light",
    "bevy_log",
    "bevy_material",
    "bevy_mesh",
    "bevy_mikktspace",
    "bevy_pbr",
    "bevy_picking",
    "bevy_post_process",
    "bevy_render",
    "bevy_scene",
    "bevy_shader",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_ui_widgets",
    "bevy_window",
    "bevy_winit",
    "bevy_world_serialization",
    "ktx2",
    "mesh_picking",
    "reflect_auto_register",
    "smaa_luts",
    "std",
    "tonemapping_luts",
    "ui_picking",
    "vorbis",
    "zstd_rust",
] }
bevy_panorbit_camera = "0.35.0"
capablanca-engine = { path = "../engine" }
ewebsock = "0.8.0"
fastrand = { version = "2.5.0", features = ["js"] }
multiplayer-protocol = { path = "../multiplayer-protocol" }
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
    "basis-universal",
    "multi_threaded",
    "wayland",
    "x11",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19.0", default-features = false, features = ["webgl2"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Element", "ErrorEvent", "Location", "MessageEvent", "Storage", "Window", "Worker"] }
