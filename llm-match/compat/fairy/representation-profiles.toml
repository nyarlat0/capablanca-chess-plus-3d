# CLI --llm-profile > LLM_PROFILE > active_profile.
# Each pair differs ONLY in whether history is included. Context fitting is automatic.
active_profile = "classic"

[profiles.classic]
state_format = "pieces_ascii"
history_mode = "full"
history_format = "semantic"
output_format = "semantic"

[profiles.classic-no-history]
state_format = "pieces_ascii"
history_mode = "none"
history_format = "semantic"
output_format = "semantic"

[profiles.numeric]
state_format = "numeric"
history_mode = "full"
history_format = "numeric"
output_format = "numeric"

[profiles.numeric-no-history]
state_format = "numeric"
history_mode = "none"
history_format = "numeric"
output_format = "numeric"

[profiles.numeric-ascii]
state_format = "numeric_ascii"
history_mode = "full"
history_format = "numeric"
output_format = "numeric"

[profiles.numeric-ascii-no-history]
state_format = "numeric_ascii"
history_mode = "none"
history_format = "numeric"
output_format = "numeric"

[profiles.hybrid]
state_format = "numeric_ascii"
history_mode = "full"
history_format = "semantic"
output_format = "semantic"

[profiles.hybrid-no-history]
state_format = "numeric_ascii"
history_mode = "none"
history_format = "semantic"
output_format = "semantic"

[profiles.uci]
state_format = "pieces_ascii"
history_mode = "full"
history_format = "uci"
output_format = "uci"

[profiles.uci-no-history]
state_format = "pieces_ascii"
history_mode = "none"
history_format = "uci"
output_format = "uci"

[profiles.numeric-json]
state_format = "numeric"
history_mode = "full"
history_format = "numeric_json"
output_format = "numeric_json"

[profiles.numeric-json-no-history]
state_format = "numeric"
history_mode = "none"
history_format = "numeric_json"
output_format = "numeric_json"
