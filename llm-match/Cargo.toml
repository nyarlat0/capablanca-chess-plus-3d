[package]
name = "llm-match"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
prompt-core = {path = "../../ai-tg-bot/crates/prompt-core"}
capablanca-engine = { path = "../engine" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
