[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.12"
actix-ws = "0.4"
anyhow = "1.0"
capablanca-engine = { path = "../engine" }
dotenvy = "0.15"
multiplayer-protocol = { path = "../multiplayer-protocol" }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "derive", "macros"] }
thiserror = "2.0"
tokio = { version = "1.49", features = ["sync", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.19", features = ["v4"] }
